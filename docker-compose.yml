services:
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: finance-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  trino:
    image: trinodb/trino:484
    container_name: finance-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    depends_on:
      - iceberg-rest
      - minio

  iceberg-rest:
    image: apache/iceberg-rest-fixture
    container_name: finance-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://finance-lake/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: "jdbc:sqlite:/tmp/iceberg_catalog.db?journal_mode=WAL"
    volumes:
      - iceberg_catalog_data:/tmp
    depends_on:
      - minio

volumes:
  minio_data:
  iceberg_catalog_data: